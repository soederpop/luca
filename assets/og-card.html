<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Luca social card</title>
<!-- Source for public/assets/og.png. Rebuild with: luca og (needs luca serve running on 4320) -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f4efe4; color: #1a1815; font-family: "Archivo", sans-serif; position: relative; }
  .frame { position: absolute; inset: 28px; border: 4px solid #1a1815; }
  .tag { position: absolute; left: 72px; top: 76px; display: flex; border: 3px solid #1a1815; font: 700 20px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
  .tag span { padding: 7px 14px; }
  .tag .num { background: #d7301f; color: #fff; border-right: 3px solid #1a1815; }
  h1 { position: absolute; left: 68px; top: 150px; margin: 0; font: 400 112px/0.98 "Archivo Black", sans-serif; letter-spacing: -0.035em; width: 640px; }
  .foot { position: absolute; left: 72px; bottom: 74px; display: flex; align-items: center; gap: 16px; font: 400 30px "Archivo Black", sans-serif; }
  .foot svg { width: 46px; height: 46px; }
  .foot .url { font: 500 22px "IBM Plex Mono", monospace; color: #645d52; margin-left: 10px; }
  #art { position: absolute; right: 78px; top: 78px; width: 380px; }
  #art svg { width: 100%; height: auto; }
  #art text { display: none; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="tag"><span class="num">Luca</span><span>CLI · SDK · Desktop</span></div>
  <h1>Build with AI Safely.</h1>
  <div class="foot"><i id="logo"></i>luca<span class="url">luca-js.soederpop.com</span></div>
  <div id="art"></div>
  <script type="module">
    import { scene, logo } from '/assets/bricks.js'
    document.getElementById('logo').outerHTML = logo
    const layers = [
      { x: 0, y: 0, z: 0, w: 4, d: 3, h: 0.4, color: 'plate' },
      { x: 0, y: 0, z: 0.4, w: 4, d: 3, color: 'blue' },
      { x: 1, y: 0, z: 1.5, w: 3, d: 3, color: 'yellow' },
      { x: 1, y: 0, z: 2.6, w: 3, d: 2, color: 'green' },
      { x: 2, y: 0, z: 3.7, w: 2, d: 2, color: 'purple' },
      { x: 2, y: 0, z: 4.8, w: 2, d: 1, color: 'red' },
    ]
    scene(document.getElementById('art'), { unit: 30, pieces: layers, padRight: 20 })
    document.fonts.ready.then(() => document.body.dataset.ready = '1')
  </script>
</body>
</html>
